name: Build webhome-spider JAR

on:
  workflow_dispatch:
  push:
    paths:
      - 'com/fongmi/spider/WebHomeSpider.java'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (for sdkmanager/d8)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK (cmdline-tools + build-tools + platform)
        run: |
          sdk_url="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          wget -q $sdk_url -O cmdline-tools.zip
          mkdir -p $HOME/android-sdk/cmdline-tools
          unzip -q cmdline-tools.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          # Accept licenses non-interactively
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platforms;android-34"
          # Verify d8 exists
          ls -la $HOME/android-sdk/build-tools/
          ls -la $HOME/android-sdk/build-tools/*/d8

      - name: Set up JDK 8 (for compiling spider)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Create stub Spider API (for compilation)
        run: |
          mkdir -p stub/com/fongmi/core/spider
          cat > stub/com/fongmi/core/spider/Spider.java << 'EOF'
          package com.fongmi.core.spider;
          import android.content.Context;
          public abstract class Spider {
              public void init(Context context, String extend) {}
              public String homeContent(boolean filter) { return "{}"; }
              public String categoryContent(String tid, boolean filter, String extend) { return "{}"; }
              public String detailContent(String[] ids) { return "{}"; }
              public String searchContent(String key, boolean quick, String extend) { return "{}"; }
              public String playerContent(String flag, String id, String[] vipFlags) { return "{}"; }
          }
          EOF
          mkdir -p stub/android/content
          cat > stub/android/content/Context.java << 'EOF'
          package android.content;
          public class Context {}
          EOF
          javac -d stub stub/com/fongmi/core/spider/Spider.java stub/android/content/Context.java

      - name: Compile Java -> .class (Java 8 bytecode)
        run: |
          mkdir -p out/classes
          javac -source 8 -target 8 -cp $HOME/android-sdk/platforms/android-34/android.jar:stub -d out/classes com/github/catvod/spider/webhome.java

      - name: Convert .class -> classes.dex (d8)
        run: |
          D8_PATH=$(find $HOME/android-sdk/build-tools -name d8 | head -1)
          echo "Using d8: $D8_PATH"
          # d8 requires Java 11+, use Java 17 installed earlier
          export JAVA_HOME=$JAVA_HOME_17_X64
          export PATH=$JAVA_HOME/bin:$PATH
          $D8_PATH --output out out/classes/com/github/catvod/spider/webhome.class

      - name: Package JAR
        run: |
          jar cf webhome-spider.jar -C out classes.dex

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: webhome-spider.jar
          path: webhome-spider.jar
          retention-days: 7
