name: Build webhome-spider JAR

on:
  workflow_dispatch:
  push:
    paths:
      - 'com/fongmi/spider/WebHomeSpider.java'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (for sdkmanager/d8)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK (cmdline-tools + build-tools + platform)
        run: |
          sdk_url="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          wget -q $sdk_url -O cmdline-tools.zip
          mkdir -p $HOME/android-sdk/cmdline-tools
          unzip -q cmdline-tools.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          echo "y" | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Set up JDK 8 (for compiling spider)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Compile Java -> .class (Java 8 bytecode)
        run: |
          mkdir -p out/classes
          javac -source 8 -target 8 -cp $HOME/android-sdk/platforms/android-34/android.jar -d out/classes com/fongmi/spider/WebHomeSpider.java

      - name: Convert .class -> classes.dex (d8)
        run: |
          $HOME/android-sdk/build-tools/34.0.0/d8 --output out out/classes/com/fongmi/spider/WebHomeSpider.class

      - name: Package JAR
        run: |
          jar cf webhome-spider.jar -C out classes.dex

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: webhome-spider.jar
          path: webhome-spider.jar
          retention-days: 7
